name: Weekly HackenProof Watch

on:
  schedule:
    - cron: "0 13 * * 1" # Every Monday 13:00 UTC
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run watcher
        run: |
          python scripts/hackenproof_watch.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/hackenproof_snapshot.json reports/hackenproof_weekly_report.md
          git diff --cached --quiet || git commit -m "chore: weekly hackenproof watch update"
          git push
